name: Web checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: marketlab
          POSTGRES_PASSWORD: ci_fixture_only
          POSTGRES_DB: marketlab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marketlab -d marketlab_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Verify checked-in dashboard artifact hashes
        run: npm run verify:artifacts
      - name: Test research and paper execution
        run: npm test
        env:
          MARKET_TEST_DATABASE_URL: postgresql://marketlab:ci_fixture_only@127.0.0.1:5432/marketlab_test
      - name: Build production server
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Bundle cloud server and public frontend
        run: node tools/build_cloud.mjs && python tools/package_cloud.py
      - name: Check typed sizing and CMS persistence
        run: npm run typecheck && npm run cms:verify
