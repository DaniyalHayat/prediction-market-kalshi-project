syntax = "proto3";
package marketlab.v1;

service Ingest {
  rpc Publish(EventEnvelope) returns (PublishAck);
}

message EventEnvelope {
  string stream_id = 1;
  uint64 sequence = 2;
  string event_id = 3;
  string event_type = 4;
  bytes payload_json = 5;
}

message PublishAck {
  bool accepted = 1;
  uint64 sequence = 2;
  string reason = 3;
}
